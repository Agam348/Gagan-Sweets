<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Royal Maroon Gradient -->
    <radialGradient id="maroonGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#721414" />
      <stop offset="70%" stop-color="#4e0b0b" />
      <stop offset="100%" stop-color="#320606" />
    </radialGradient>

    <!-- Metallic Antique Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb6" />
      <stop offset="25%" stop-color="#d4a340" />
      <stop offset="50%" stop-color="#996c18" />
      <stop offset="75%" stop-color="#e8c662" />
      <stop offset="100%" stop-color="#b37c1d" />
    </linearGradient>

    <!-- Highlight Gold -->
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#caa03f" />
      <stop offset="50%" stop-color="#fff2ce" />
      <stop offset="100%" stop-color="#d4a340" />
    </linearGradient>

    <!-- Soft Filter for Depth -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Circle with Outer Gold Bezel -->
  <circle cx="100" cy="100" r="96" fill="url(#goldSheen)" filter="url(#softGlow)" />
  <circle cx="100" cy="100" r="92" fill="#2c0505" />
  
  <!-- Dotted Beaded Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-dasharray="2.5,4" />

  <!-- Inner Maroon Medallion -->
  <circle cx="100" cy="100" r="84" fill="url(#maroonGrad)" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldSheen)" stroke-width="1.2" opacity="0.8" />

  <!-- Symmetrical Flourish / Laurels -->
  <!-- Left Laurel Wreath -->
  <g fill="url(#goldLight)" opacity="0.9">
    <path d="M 68,136 C 58,124 54,106 58,88 C 60,80 64,74 68,70 C 66,76 64,84 65,94 C 66,104 70,120 76,130 Z" />
    <!-- Leaflets Left -->
    <path d="M 58,86 C 50,82 46,74 48,68 C 54,70 58,76 58,86 Z" />
    <path d="M 55,102 C 46,100 42,94 44,88 C 50,90 54,95 55,102 Z" />
    <path d="M 58,118 C 50,118 46,112 48,106 C 54,108 57,112 58,118 Z" />
    <path d="M 65,132 C 58,134 54,128 56,122 C 61,124 64,127 65,132 Z" />
  </g>

  <!-- Right Laurel Wreath (Mirrored) -->
  <g fill="url(#goldLight)" opacity="0.9" transform="translate(200, 0) scale(-1, 1)">
    <path d="M 68,136 C 58,124 54,106 58,88 C 60,80 64,74 68,70 C 66,76 64,84 65,94 C 66,104 70,120 76,130 Z" />
    <!-- Leaflets Right -->
    <path d="M 58,86 C 50,82 46,74 48,68 C 54,70 58,76 58,86 Z" />
    <path d="M 55,102 C 46,100 42,94 44,88 C 50,90 54,95 55,102 Z" />
    <path d="M 58,118 C 50,118 46,112 48,106 C 54,108 57,112 58,118 Z" />
    <path d="M 65,132 C 58,134 54,128 56,122 C 61,124 64,127 65,132 Z" />
  </g>

  <!-- Top Imperial Crown / Kalash Motif -->
  <g transform="translate(100, 48)" fill="url(#goldLight)" filter="url(#softGlow)">
    <!-- Central Crown Arch -->
    <path d="M 0,-14 C 4,-7 7,-4 0,0 C -7,-4 -4,-7 0,-14 Z" />
    <circle cx="0" cy="-16" r="2.5" />
    <!-- Left Crown Spire -->
    <path d="M -12,-6 C -9,-3 -6,-1 -11,4 C -14,2 -14,-2 -12,-6 Z" />
    <circle cx="-13" cy="-7" r="1.8" />
    <!-- Right Crown Spire -->
    <path d="M 12,-6 C 9,-3 6,-1 11,4 C 14,2 14,-2 12,-6 Z" />
    <circle cx="13" cy="-7" r="1.8" />
    <!-- Crown Base Band -->
    <path d="M -18,6 Q 0,9 18,6 Q 0,11 -18,6 Z" />
  </g>

  <!-- Centerpiece: Royal Intertwined "GS" Monogram -->
  <g transform="translate(100, 106)" filter="url(#softGlow)">
    <!-- "G" Letterform -->
    <text x="-4" y="16"
          font-family="'Playfair Display', 'Cinzel', Georgia, serif"
          font-size="62"
          font-weight="800"
          font-style="italic"
          fill="url(#goldSheen)"
          text-anchor="middle"
          stroke="#420808"
          stroke-width="1.5">
      G
    </text>

    <!-- "S" Letterform interlaced -->
    <text x="14" y="24"
          font-family="'Playfair Display', 'Cinzel', Georgia, serif"
          font-size="46"
          font-weight="900"
          fill="url(#goldLight)"
          text-anchor="middle"
          stroke="#320505"
          stroke-width="1">
      S
    </text>
  </g>

  <!-- Bottom Little Star -->
  <g transform="translate(100, 154)" fill="url(#goldLight)">
    <polygon points="0,-4 1.5,-1 5,-1 2.2,1.2 3.2,4.5 0,2.5 -3.2,4.5 -2.2,1.2 -5,-1 -1.5,-1" />
  </g>
</svg>
